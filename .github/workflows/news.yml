# Copies new official Pokémon Sleep news posts into Discord, word for word.
# Hourly; posted.json (committed back) remembers what was sent. The first run
# only records what's already there, so the channel isn't flooded.
# Secret: NEWS_WEBHOOK_URL (the channel's webhook: Edit Channel > Integrations > Webhooks).
# Optional: NEWS_PING_ROLE_ID, NEWS_IMAGES=off; events need secret DISCORD_BOT_TOKEN and
# variables DISCORD_GUILD_ID, NEWS_EVENT_INVITE, NEWS_EVENT_TZ (see README).
# Run it by hand to test: "post_id" (one post) or "latest" (the N newest), neither
# of which touches posted.json, or "dry_run" to only print.
name: News to Discord

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post this news post (the long number in its URL)"
        required: false
      latest:
        description: "Post the N newest posts"
        required: false
      dry_run:
        description: "Only print what would be sent"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Post news
        env:
          NEWS_WEBHOOK_URL: ${{ secrets.NEWS_WEBHOOK_URL }}
          # Optional: the role pinged under each title; NEWS_IMAGES=off to leave images out.
          NEWS_PING_ROLE_ID: ${{ vars.NEWS_PING_ROLE_ID }}
          NEWS_IMAGES: ${{ vars.NEWS_IMAGES }}
          # Optional: a bot (webhooks can't create events) turns each Event Period into a Discord event.
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          NEWS_EVENT_INVITE: ${{ vars.NEWS_EVENT_INVITE }}
          NEWS_EVENT_TZ: ${{ vars.NEWS_EVENT_TZ }}
          POST_ID: ${{ inputs.post_id }}
          LATEST: ${{ inputs.latest }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          if [ -n "$POST_ID" ]; then args+=(--post "$POST_ID")
          elif [ -n "$LATEST" ]; then args+=(--latest "$LATEST"); fi
          python3 news_to_discord.py "${args[@]}"
      - name: Save what was posted
        if: always()
        run: |
          git add posted.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit -m "Posted news"
          git push
      - name: Run tests
        if: github.event_name == 'workflow_dispatch'
        run: python3 -m unittest discover -s tests
